<rect x="40" y="30" width="1720" height="88" rx="22" fill="#0f172a" filter="url(#shadow)"/>
<text x="900" y="70" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff">AgroEarthFM — Finalised MVP Architecture</text>
<text x="900" y="101" font-size="18" font-weight="500" text-anchor="middle" fill="#cbd5e1">Multimodal drought–phenology representation learning with weak physics regularisation and causal-informed diagnostics</text>
<text x="130" y="160" font-size="17" font-weight="800" text-anchor="middle" fill="#334155">1. MULTI-RESOLUTION INPUTS</text>
<text x="500" y="160" font-size="17" font-weight="800" text-anchor="middle" fill="#334155">2. DATA QA + TOKENISATION</text>
<text x="805" y="160" font-size="17" font-weight="800" text-anchor="middle" fill="#334155">3. MODALITY ENCODERS</text>
<text x="1140" y="160" font-size="17" font-weight="800" text-anchor="middle" fill="#334155">4. FUSION + MEMORY</text>
<text x="1460" y="160" font-size="17" font-weight="800" text-anchor="middle" fill="#334155">5. OUTPUTS + EVALUATION</text>
<rect x="55" y="190" width="300" height="125" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="205.0" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Fine EO / Vegetation</text>
<text x="73" y="246" font-size="15" fill="#374151">HLS / Sentinel-2 / Landsat</text>
<text x="73" y="268" font-size="15" fill="#374151">Optional SAR for cloud fallback</text>
<text x="73" y="290" font-size="15" fill="#374151">Reflectance + NDVI/EVI/NDWI</text>
<text x="73" y="312" font-size="15" fill="#374151">Native scale: 10–30 m</text>
<rect x="55" y="337" width="300" height="125" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="205.0" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Weather / Climate Forcing</text>
<text x="73" y="393" font-size="15" fill="#374151">Rainfall, temperature, humidity</text>
<text x="73" y="415" font-size="15" fill="#374151">radiation, wind, VPD proxies</text>
<text x="73" y="437" font-size="15" fill="#374151">ERA5 / CHIRPS etc.</text>
<text x="73" y="459" font-size="15" fill="#374151">Native/coarse scale retained</text>
<rect x="55" y="484" width="300" height="125" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="205.0" y="512" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Soil / Hydro Context</text>
<text x="73" y="540" font-size="15" fill="#374151">SoilGrids, SMAP/ESA CCI</text>
<text x="73" y="562" font-size="15" fill="#374151">DEM/topography if available</text>
<text x="73" y="584" font-size="15" fill="#374151">Soil water capacity, texture</text>
<text x="73" y="606" font-size="15" fill="#374151">Native uncertainty preserved</text>
<rect x="55" y="631" width="300" height="125" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<text x="205.0" y="659" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Crop / Management Context</text>
<text x="73" y="687" font-size="15" fill="#374151">Crop type, crop calendar</text>
<text x="73" y="709" font-size="15" fill="#374151">planting window, crop mask</text>
<text x="73" y="731" font-size="15" fill="#374151">irrigation proxy if available</text>
<text x="73" y="753" font-size="15" fill="#374151">mask confidence included</text>
<rect x="55" y="778" width="300" height="125" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="205.0" y="806" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Labels / Validation Data</text>
<text x="73" y="834" font-size="15" fill="#374151">Phenology events or proxies</text>
<text x="73" y="856" font-size="15" fill="#374151">drought-event records</text>
<text x="73" y="878" font-size="15" fill="#374151">yield / yield anomaly labels</text>
<text x="73" y="900" font-size="15" fill="#374151">validated only at label scale</text>
<rect x="405" y="210" width="300" height="560" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="555.0" y="238" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Quality-Controlled Multi-Resolution Datacube</text>
<text x="423" y="266" font-size="15" fill="#374151">• No forced 10 m upscaling of coarse data</text>
<text x="423" y="288" font-size="15" fill="#374151">• CRS + time metadata retained</text>
<text x="423" y="310" font-size="15" fill="#374151">• Native-scale tokens or pooled features</text>
<text x="423" y="332" font-size="15" fill="#374151">• 5–10 day fine EO windows</text>
<text x="423" y="354" font-size="15" fill="#374151">• monthly / seasonal climate context</text>
<text x="423" y="376" font-size="15" fill="#374151">• cloud, gap, crop-mask, data-quality masks</text>
<text x="423" y="398" font-size="15" fill="#374151">• modality-present masks</text>
<text x="423" y="420" font-size="15" fill="#374151">• train/val/test split locked before training</text>
<text x="423" y="451.0" font-size="15" fill="#374151">Core anti-failure rule:</text>
<text x="423" y="473.0" font-size="15" fill="#374151">validation occurs at the scale of ground truth</text>
<rect x="760" y="190" width="285" height="105" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="902.5" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">EO Temporal Patch Encoder</text>
<text x="778" y="240" font-size="13" fill="#374151">ViT/CNN-hybrid or compact ViT</text>
<text x="778" y="260" font-size="13" fill="#374151">spectral + temporal embeddings</text>
<rect x="760" y="320" width="285" height="105" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="902.5" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Weather Temporal Encoder</text>
<text x="778" y="370" font-size="13" fill="#374151">Temporal Transformer / TCN</text>
<text x="778" y="390" font-size="13" fill="#374151">lag-aware climate forcing</text>
<rect x="760" y="450" width="285" height="105" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="902.5" y="478" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Soil / Static Context Encoder</text>
<text x="778" y="500" font-size="13" fill="#374151">MLP or optional shared GNN</text>
<text x="778" y="520" font-size="13" fill="#374151">soil, hydro, topography tokens</text>
<rect x="760" y="580" width="285" height="105" rx="18" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
<text x="902.5" y="608" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Crop Calendar Encoder</text>
<text x="778" y="630" font-size="13" fill="#374151">crop type + planting window</text>
<text x="778" y="650" font-size="13" fill="#374151">AGDD-aware phenology prior</text>
<rect x="760" y="710" width="285" height="105" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="902.5" y="738" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Missing-Modality Handler</text>
<text x="778" y="760" font-size="13" fill="#374151">learned null tokens + masks</text>
<text x="778" y="780" font-size="13" fill="#374151">modality dropout during training</text>
<rect x="1090" y="205" width="330" height="170" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="1255.0" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Scale-Aware Causal-Ordered Fusion</text>
<text x="1108" y="261" font-size="15" fill="#374151">Cross-resolution attention / gated fusion</text>
<text x="1108" y="283" font-size="15" fill="#374151">Suggested order:</text>
<text x="1108" y="305" font-size="15" fill="#374151">weather → soil/water state → vegetation</text>
<text x="1108" y="327" font-size="15" fill="#374151">vegetation + crop prior → phenology state</text>
<text x="1108" y="349" font-size="15" fill="#374151">token budget explicitly controlled</text>
<rect x="1090" y="430" width="330" height="160" rx="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="1255.0" y="458" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Hierarchical Temporal Memory</text>
<text x="1108" y="486" font-size="15" fill="#374151">Fine path: 5–10 day dynamics</text>
<text x="1108" y="508" font-size="15" fill="#374151">Coarse path: monthly/seasonal context</text>
<text x="1108" y="530" font-size="15" fill="#374151">tracks lagged drought effects</text>
<text x="1108" y="552" font-size="15" fill="#374151">explicit AGDD accumulator</text>
<rect x="1090" y="650" width="330" height="135" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="1255.0" y="678" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Shared Agro-Ecosystem State z_t</text>
<text x="1108" y="706" font-size="15" fill="#374151">Vegetation health, soil-water context,</text>
<text x="1108" y="728" font-size="15" fill="#374151">phenology state, stress accumulation,</text>
<text x="1108" y="750" font-size="15" fill="#374151">latent residual-water anomaly, uncertainty</text>
<rect x="1480" y="180" width="265" height="95" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="1612.5" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Crop Stress Head</text>
<text x="1498" y="230" font-size="13" fill="#374151">water/heat/stress score</text>
<text x="1498" y="250" font-size="13" fill="#374151">event probability + uncertainty</text>
<rect x="1480" y="298" width="265" height="95" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="1612.5" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Phenology Forecast Head</text>
<text x="1498" y="348" font-size="13" fill="#374151">current stage + transition timing</text>
<text x="1498" y="368" font-size="13" fill="#374151">MAE days / transition F1</text>
<rect x="1480" y="416" width="265" height="95" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="1612.5" y="444" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Drought Trajectory Head</text>
<text x="1498" y="466" font-size="13" fill="#374151">stress evolution and recovery</text>
<text x="1498" y="486" font-size="13" fill="#374151">lead-time skill</text>
<rect x="1480" y="534" width="265" height="95" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<text x="1612.5" y="562" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Yield-Risk / Anomaly Head</text>
<text x="1498" y="584" font-size="13" fill="#374151">production-risk, not food-security</text>
<text x="1498" y="604" font-size="13" fill="#374151">validated at label scale</text>
<rect x="1480" y="652" width="265" height="95" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="1612.5" y="680" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Residual Water / Uncertainty</text>
<text x="1498" y="702" font-size="13" fill="#374151">latent unobserved water input</text>
<text x="1498" y="722" font-size="13" fill="#374151">not automatically irrigation</text>
<rect x="1480" y="770" width="265" height="115" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="1612.5" y="798" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Validation Dashboard</text>
<text x="1498" y="820" font-size="13" fill="#374151">task metrics + calibration</text>
<text x="1498" y="840" font-size="13" fill="#374151">physics residuals + sign checks</text>
<text x="1498" y="860" font-size="13" fill="#374151">OOD region/year/event splits</text>
<text x="900" y="835" font-size="17" font-weight="800" text-anchor="middle" fill="#334155">TRAINING OBJECTIVES, PHYSICS REGULARISATION, AND CAUSAL-INFORMED VALIDATION</text>
<rect x="70" y="865" width="390" height="215" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="265.0" y="893" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Process-Centered SSL Objectives</text>
<text x="88" y="921" font-size="15" fill="#374151">1. masked spatiotemporal reconstruction</text>
<text x="88" y="943" font-size="15" fill="#374151">2. cross-modal masked prediction</text>
<text x="88" y="965" font-size="15" fill="#374151">3. future vegetation trajectory prediction</text>
<text x="88" y="987" font-size="15" fill="#374151">4. phenology pseudo-transition prediction</text>
<text x="88" y="1009" font-size="15" fill="#374151">5. drought stress trajectory prediction</text>
<text x="88" y="1031" font-size="15" fill="#374151">scenario augmentation only after physics passes</text>
<rect x="510" y="865" width="390" height="215" rx="18" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
<text x="705.0" y="893" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Weak Physics Regularisation</text>
<text x="528" y="921" font-size="15" fill="#374151">Water balance: ΔSM = P + I_latent − ET − R − D + ε</text>
<text x="528" y="943" font-size="15" fill="#374151">Plant growth: AGDD + water + radiation limits</text>
<text x="528" y="965" font-size="15" fill="#374151">uncertainty-weighted soft losses</text>
<text x="528" y="987" font-size="15" fill="#374151">accepted only if residual improves without task collapse</text>
<rect x="950" y="865" width="390" height="215" rx="18" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
<text x="1145.0" y="893" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Temporal-DAG Diagnostics</text>
<text x="968" y="921" font-size="15" fill="#374151">No same-time cycles</text>
<text x="968" y="943" font-size="15" fill="#374151">sign checks: rainfall→soil moisture, ET→soil moisture</text>
<text x="968" y="965" font-size="15" fill="#374151">monotonicity under plausible scenarios</text>
<text x="968" y="987" font-size="15" fill="#374151">invariance across region/year/event splits</text>
<rect x="1390" y="865" width="350" height="215" rx="18" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="1565.0" y="893" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Baselines + Gates</text>
<text x="1408" y="921" font-size="15" fill="#374151">climatology, persistence, GDD, SPI/SPEI/VHI</text>
<text x="1408" y="943" font-size="15" fill="#374151">RF/XGBoost, LSTM/TCN, single-modality models</text>
<text x="1408" y="965" font-size="15" fill="#374151">no-physics and no-process-SSL ablations</text>
<text x="1408" y="987" font-size="15" fill="#374151">G0–G7 go/no-go acceptance gates</text>
<rect x="70" y="1110" width="1670" height="92" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 7"/>
<text x="905.0" y="1138" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Deferred Year-2 Extensions</text>
<text x="88" y="1166" font-size="15" fill="#374151">Formal counterfactual module, neural causal discovery, full process-model comparison, socioeconomic food-security layer, global multi-biome scaling.</text>
